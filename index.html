
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <h1>Smart Expense Tracker</h1>
        <p>Track your spending. Stay in control.</p>
    </header>

    <main class="container">

        <!-- Summary cards -->
        <section class="summary">
            <div class="card">
                <h3>Total Spent</h3>
                <p id="totalSpent">₹0.00</p>
            </div>

            <div class="card">
                <h3>Monthly Budget</h3>
                <p id="monthlyBudget">₹5,000.00</p>
            </div>

            <div class="card">
                <h3>Remaining Budget</h3>
                <p id="remainingBudget">₹5,000.00</p>
            </div>
        </section>

        <!-- Add expense form -->
        <section class="panel">
            <h2>Add New Expense</h2>

            <form id="expenseForm">
                <label for="description">Expense Name</label>
                <input
                    type="text"
                    id="description"
                    placeholder="e.g. Lunch"
                    maxlength="100"
                    required
                >

                <label for="amount">Amount (₹)</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="e.g. 150"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="category">Category</label>
                <select id="category">
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>

                <label for="date">Date</label>
                <input type="date" id="date" required>

                <button type="submit">Add Expense</button>
            </form>
        </section>
<!-- Spending chart -->
<section class="panel">
    <h2>Spending by Category</h2>
    <canvas id="expenseChart"></canvas>
</section>
        <!-- Expense history -->
         <div id="budgetWarning" class="budget-warning" hidden>
</div>
         <div class="search-box">
    <input
        type="text"
        id="searchExpense"
        placeholder="🔍 Search expenses..."
    >
</div>
        <section class="panel">
            <h2>Expense History</h2>

            <label for="filterCategory">Filter by category</label>
            <select id="filterCategory">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>

            <div id="expenseList">
                <p class="empty-message">
                    No expenses yet. Add your first expense!
                </p>
            </div>
        </section>

    </main>

    <footer>
        <p>Smart Expense Tracker | Personal Learning Project</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>
</body>
</html>
